name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check formatting
        run: nix develop .#default -c zig fmt --check .

      - name: Check REUSE compliance
        run: nix develop .#default -c reuse lint

      - name: Run tests
        run: nix develop .#default -c zig build test

      - name: Build API docs
        run: nix develop .#default -c zig build docs

  docs:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos
    env:
      ZIG_LOCAL_CACHE_DIR: /zig/local-cache
      ZIG_GLOBAL_CACHE_DIR: /zig/global-cache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build API docs
        run: nix develop .#default -c zig build docs

      - name: Publish docs
        run: nix develop .#default -c git-pages-cli https://jeff.ocj.page/zig-uuid/ --server ocj.page --token ${{ forge.token }} --upload-dir zig-out/docs
